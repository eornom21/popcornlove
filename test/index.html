<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>It Works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{--bg:#F5F3EC;--paper:#FFFDF8;--ink:#1C1F1A;--body:#3A4335;--muted:#69745F;--line:#E2DCCD;--accent:#1B3322;--accent-ink:#F2EFE4;--hl:#B85B18}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#12160F;--paper:#1A2017;--ink:#EDEBE0;--body:#CBD2C2;--muted:#93A089;--line:#2E3828;--accent:#16281B;--accent-ink:#EDEBE0;--hl:#E08A44}}
:root[data-theme="dark"]{--bg:#12160F;--paper:#1A2017;--ink:#EDEBE0;--body:#CBD2C2;--muted:#93A089;--line:#2E3828;--accent:#16281B;--accent-ink:#EDEBE0;--hl:#E08A44}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--body);font:16px/1.55 'Source Sans 3',system-ui,sans-serif}
header{background:var(--accent);color:var(--accent-ink);padding:32px 16px 24px;text-align:center}
h1{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:clamp(30px,7vw,46px);letter-spacing:.5px;line-height:1.05}
.sub{opacity:.8;margin-top:6px}
main{max-width:860px;margin:0 auto;padding:24px 16px 64px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;margin:14px 0}
footer{text-align:center;color:var(--muted);font-size:13px;padding:0 16px 32px}
</style>
</head>
<body>
<header>
  <h1>IT WORKS</h1>
  <div class="sub">Published from a Claude chat, straight to popcornlove.net</div>
</header>
<main>
  <div class="card">
    <p>From any chat, in any project: “make a page that does X and put it live.” Claude builds it, pushes it to GitHub, and sends back a link like this one.</p>
  </div>
</main>
<footer>Test page · October 9, 2026</footer>
</body>
</html>
