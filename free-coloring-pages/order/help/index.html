<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Order help | Make a Coloring Book</title>
<meta name="theme-color" content="#FFF6E5">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../fonts.css">
<link rel="stylesheet" href="../../site.css">
<style>
.od{max-width:720px;margin:0 auto;padding:10px 0 40px;color:var(--body)}
.od h1{font:700 clamp(30px,5vw,42px)/1.05 var(--display);color:var(--ink);margin:16px 0 6px}
.box{background:var(--card);border:2.5px solid var(--ink);border-radius:18px;box-shadow:4px 4px 0 var(--ink);padding:18px;margin:16px 0}
.od label{display:block;font:800 14px/1.2 var(--text);color:var(--ink);margin:12px 0 5px}
.od input[type=text],.od input[type=email],.od textarea{width:100%;box-sizing:border-box;font:600 16px/1.35 var(--text);padding:10px 12px;border:2px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink)}
.od textarea{min-height:90px}
.opts label{display:flex;gap:10px;align-items:flex-start;font-weight:700;margin:8px 0;cursor:pointer}
.opts input{margin-top:3px}
.msg{font-weight:800;margin-top:12px;min-height:1.2em;line-height:1.45}.msg.bad{color:var(--tomato)}.msg.good{color:var(--leaf)}
.hide{display:none}
</style>
<script src="../../ga.js"></script>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="../../"><span class="c1">Free</span> <span class="c2">Coloring</span> <span class="c3">Pages</span></a>
  <nav class="topnav"><a href="../../">All free pages</a><a href="../">Printed books</a></nav>
</div></header>
<main class="wrap"><div class="od">
<h1>Order help</h1>
<p>Something wrong with your printed book? Tell us here. Most problems are fixed right away.</p>
<div class="box" id="formBox">
  <label for="oid">Order number <small>(starts with MCB-, in your confirmation email)</small></label><input type="text" id="oid" maxlength="12" placeholder="MCB-ABC123" autocapitalize="characters">
  <label for="em">Email you used at checkout</label><input type="email" id="em" maxlength="120">
  <label>What happened?</label>
  <div class="opts">
    <label><input type="radio" name="k" value="misprint"> It's misprinted (pages missing, upside down, smeared, wrong book)</label>
    <label><input type="radio" name="k" value="damaged"> It arrived damaged</label>
    <label><input type="radio" name="k" value="lost"> It never arrived</label>
    <label><input type="radio" name="k" value="other"> Something else</label>
  </div>
  <div id="lostBox" class="hide opts"><label style="font-weight:800">If it's past the delivery date, would you like:</label>
    <label><input type="radio" name="c" value="reprint" checked> A new copy, sent again</label>
    <label><input type="radio" name="c" value="refund"> A full refund</label></div>
  <label for="note">Anything else we should know?</label><textarea id="note" maxlength="1000"></textarea>
  <div id="ts" style="margin-top:12px"></div>
  <div style="margin-top:14px"><button class="btn pri" id="send">Send</button></div>
  <div class="msg" id="msg"></div>
</div>
<p>Or email <a href="mailto:hello@makeacoloringbook.com">hello@makeacoloringbook.com</a>.</p>
</div></main>
<script>
(function(){
var $=function(s){return document.querySelector(s)},TS='',W=null,SK='';
var q=new URLSearchParams(location.search);if(q.get('order'))$('#oid').value=q.get('order');
fetch('/api/order/open').then(function(r){return r.json()}).then(function(j){SK=j.ts||'';if(!SK)return;var go=function(){W=turnstile.render('#ts',{sitekey:SK,size:'flexible',appearance:'interaction-only',callback:function(t){TS=t},'expired-callback':function(){TS=''}})};var s=document.createElement('script');s.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';s.async=true;s.onload=go;document.head.appendChild(s)});
[].forEach.call(document.querySelectorAll('input[name=k]'),function(r){r.addEventListener('change',function(){$('#lostBox').classList.toggle('hide',r.value!=='lost'||!r.checked)})});
function m(t,c){$('#msg').textContent=t;$('#msg').className='msg'+(c?' '+c:'')}
$('#send').addEventListener('click',function(){var k=document.querySelector('input[name=k]:checked'),c=document.querySelector('input[name=c]:checked');
  if(!$('#oid').value.trim()||!$('#em').value.trim()||!k){m('Please fill in the order number, email and what happened.','bad');return}
  if(SK&&!TS){m('One moment, checking that you are a person. Then press Send again.','bad');return}
  $('#send').disabled=true;m('Sending…');
  fetch('/api/order/help',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({order:$('#oid').value,email:$('#em').value,kind:k.value,choice:c?c.value:'',note:$('#note').value,ts:TS})}).then(function(r){return r.json()}).then(function(j){
    if(j.error){$('#send').disabled=false;TS='';try{turnstile.reset(W)}catch(e){}m(j.message||'That did not work. Please try again.','bad');return}
    m(j.message,'good');$('#send').style.display='none'}).catch(function(){$('#send').disabled=false;m('No answer from the server. Please try again.','bad')})});
})();
</script>
</body>
</html>
