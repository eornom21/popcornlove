name: School packets
on:
  push:
    branches: [main]
    paths: ['.github/packets/packets.json', '.github/packets/build.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: school-packets
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow numpy scipy
      - run: python .github/packets/build.py
      - name: Commit packets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add free-coloring-pages/schools .github/packets/previews
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "School packets"
          for i in 1 2 3 4 5 6; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 6
          done
          exit 1
